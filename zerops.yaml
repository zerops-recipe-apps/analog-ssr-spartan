# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json

zerops:
  - setup: prod
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - node scripts/bundle-migrate.mjs
        - node scripts/bundle-seed.mjs
        - NODE_OPTIONS=--max-old-space-size=1500 npm run build
      deployFiles:
        - dist/analog
        - migrate.cjs
        - seed.cjs
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /
    run:
      base: nodejs@22
      initCommands:
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- node migrate.cjs
        - zsc execOnce seed-v1 --retryUntilSuccessful -- node seed.cjs
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_NAME: ${db_dbName}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        APP_URL: ${zeropsSubdomain}
        CACHE_URL: ${cache_connectionString}
        NATS_HOST: ${broker_hostname}
        NATS_PORT: ${broker_port}
        NATS_USER: ${broker_user}
        NATS_PASS: ${broker_password}
        SEARCH_URL: ${search_connectionString}
        SEARCH_MASTER_KEY: ${search_masterKey}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_REGION: us-east-1
        S3_BUCKET: ${storage_bucketName}
        S3_ACCESS_KEY_ID: ${storage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${storage_secretAccessKey}
      start: node dist/analog/server/index.mjs
      healthCheck:
        httpGet:
          port: 3000
          path: /

  - setup: dev
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      initCommands:
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- node scripts/migrate.mjs
        - zsc execOnce seed-v1 --retryUntilSuccessful -- node scripts/seed.mjs
      ports:
        - port: 5173
          httpSupport: true
      envVariables:
        NODE_ENV: development
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_NAME: ${db_dbName}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        APP_URL: ${zeropsSubdomain}
        CACHE_URL: ${cache_connectionString}
        NATS_HOST: ${broker_hostname}
        NATS_PORT: ${broker_port}
        NATS_USER: ${broker_user}
        NATS_PASS: ${broker_password}
        SEARCH_URL: ${search_connectionString}
        SEARCH_MASTER_KEY: ${search_masterKey}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_REGION: us-east-1
        S3_BUCKET: ${storage_bucketName}
        S3_ACCESS_KEY_ID: ${storage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${storage_secretAccessKey}
      start: zsc noop --silent
